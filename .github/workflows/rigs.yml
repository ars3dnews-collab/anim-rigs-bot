name: Animation Rigs Bot

on:
  schedule:
    # Попытка каждые 15 минут. Это НЕ расписание постов: GitHub режет
    # частый cron и заводит задание раз в 1-8 часов. Ритм держит сам
    # бот по времени прошлого поста из posted.json — при запуске он
    # догоняет пропущенные двухчасовые слоты (см. config.py).
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      catch_up:
        description: "Режим догона: пометить всё найденное виденным, ничего не публиковать"
        type: boolean
        default: false
      redo:
        description: "Переопубликовать риги по именам через запятую (например: Brooke, Spider-Gwen)"
        type: string
        default: ""
      force:
        description: "Опубликовать сейчас: не ждать двухчасовую паузу и не смотреть на ночь"
        type: boolean
        default: false

permissions:
  contents: write

# cancel-in-progress: true — ГЛАВНАЯ защита от зависания.
# Если запуск почему-то залип, следующий его просто убивает и работает
# сам. Очередь не копится, заблокировать канал невозможно в принципе.
concurrency:
  group: rigs-bot-v2
  cancel-in-progress: true

jobs:
  post:
    runs-on: ubuntu-latest
    # ВНИМАНИЕ. Запуск обязан быть коротким: читает источники,
    # публикует и выходит, обычно за 3-8 минут. Держать задание живым
    # часами нельзя — это использование Actions как бесплатного
    # сервера, и ровно за это GitHub навсегда отключил репозиторий
    # anim-jobs-bot в ноябре 2026. Потолок ниже не поднимать.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "rigs-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Publish rigs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CATCH_UP: ${{ inputs.catch_up }}
          REDO: ${{ inputs.redo }}
          FORCE: ${{ inputs.force }}
          GIT_AUTOSAVE: "1"
        run: python bot.py

      - name: Save bot memory
        if: always()
        run: |
          git add posted.json
          git diff --staged --quiet || git commit -m "update posted rigs"
          git pull --rebase --autostash || true
          git push || true
