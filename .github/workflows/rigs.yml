name: Animation Rigs Bot

on:
  schedule:
    # Попытка каждые 20 минут — но это НЕ расписание постов.
    # Постами управляет сам бот: раз в два часа и только днём
    # (POST_EVERY_MINUTES и ACTIVE_HOURS в config.py).
    # Частые попытки нужны потому, что GitHub пропускает большую часть
    # срабатываний: при "*/20" он реально запускал задание раз в 1-5 часов.
    # Чем больше попыток, тем меньше шанс проспать двухчасовой слот.
    # Минуты 7/27/47, а не 0/20/40: на круглых минутах у GitHub самая
    # длинная очередь и больше всего отброшенных запусков.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      catch_up:
        description: "Режим догона: пометить всё найденное виденным, ничего не публиковать"
        type: boolean
        default: false
      redo:
        description: "Переопубликовать риги по именам через запятую (например: Brooke, Spider-Gwen)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    # Запуск короткий: сбор источников плюс одна публикация.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "rigs-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Publish rigs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CATCH_UP: ${{ inputs.catch_up }}
          REDO: ${{ inputs.redo }}
          # бот сам коммитит память после каждого поста, чтобы она
          # не потерялась, если запуск оборвётся посреди часа
          GIT_AUTOSAVE: "1"
        run: python bot.py

      - name: Save bot memory
        if: always()
        run: |
          git add posted.json
          git diff --staged --quiet || git commit -m "update posted rigs"
          git pull --rebase --autostash || true
          git push || true
