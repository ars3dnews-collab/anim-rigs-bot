name: Animation Rigs Bot

on:
  schedule:
    # Попытка каждые 15 минут. Это НЕ расписание постов: ритм держит сам
    # бот по времени прошлого поста из posted.json (POST_EVERY_MINUTES и
    # ACTIVE_HOURS в config.py). Расписание — просто частые стуки в дверь.
    #
    # GitHub пропускает большинство срабатываний и заводит задание раз в
    # 1-3 часа. Для шага «раз в два часа» этого достаточно: бот публикует
    # при первом же запуске после того, как пауза вышла.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      catch_up:
        description: "Режим догона: пометить всё найденное виденным, ничего не публиковать"
        type: boolean
        default: false
      redo:
        description: "Переопубликовать риги по именам через запятую (например: Brooke, Spider-Gwen)"
        type: string
        default: ""

permissions:
  contents: write

# cancel-in-progress: true — ГЛАВНАЯ защита от зависания.
# Если запуск почему-то залип, следующий его просто убивает и работает
# сам. Очередь не копится, заблокировать канал невозможно в принципе.
concurrency:
  group: rigs-bot-v2
  cancel-in-progress: true

jobs:
  post:
    runs-on: ubuntu-latest
    # Штатный запуск длится меньше минуты. Потолок в 20 минут — чтобы
    # намертво зависший запуск гарантированно умер сам, без ручной отмены.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "rigs-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Publish rigs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CATCH_UP: ${{ inputs.catch_up }}
          REDO: ${{ inputs.redo }}
          GIT_AUTOSAVE: "1"
        run: python bot.py

      - name: Save bot memory
        if: always()
        run: |
          git add posted.json
          git diff --staged --quiet || git commit -m "update posted rigs"
          git pull --rebase --autostash || true
          git push || true
