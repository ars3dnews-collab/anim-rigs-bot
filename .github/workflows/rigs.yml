name: Animation Rigs Bot

on:
  schedule:
    # Раз в 20 минут. Задание короткое: опубликовать один риг и выйти.
    # Это тот же принцип, что у бота новостей GTA 6, где ритм не рвётся.
    # Длинные задания GitHub душит — пока одно висит час, срабатывания
    # расписания в это время отбрасываются.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      catch_up:
        description: "Режим догона: пометить всё найденное виденным, ничего не публиковать"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    # Запуск короткий: сбор источников плюс одна публикация.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "rigs-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Publish rigs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CATCH_UP: ${{ inputs.catch_up }}
          # бот сам коммитит память после каждого поста, чтобы она
          # не потерялась, если запуск оборвётся посреди часа
          GIT_AUTOSAVE: "1"
        run: python bot.py

      - name: Save bot memory
        if: always()
        run: |
          git add posted.json
          git diff --staged --quiet || git commit -m "update posted rigs"
          git pull --rebase --autostash || true
          git push || true
