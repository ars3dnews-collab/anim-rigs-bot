name: Animation Rigs Bot

on:
  schedule:
    # Это НЕ расписание постов. Постами управляет сам бот: раз в два часа
    # и только днём (POST_EVERY_MINUTES и ACTIVE_HOURS в config.py).
    #
    # ОДНО срабатывание расписания запускает цепочку из трёх отрезков по
    # 5.5 часа — это 16.5 часа непрерывной работы. Так и надо, потому что
    # на расписание GitHub полагаться нельзя: проверено на двух ботах
    # сразу, он пропускает срабатывания и молчит от часа до десяти.
    # Раньше цепочка держалась на одном запуске и обрывалась, как только
    # GitHub не заводил следующий. Теперь одного срабатывания в сутки
    # хватает, чтобы канал жил весь день.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      catch_up:
        description: "Режим догона: пометить всё найденное виденным, ничего не публиковать"
        type: boolean
        default: false
      redo:
        description: "Переопубликовать риги по именам через запятую (например: Brooke, Spider-Gwen)"
        type: string
        default: ""

permissions:
  contents: write

# Одновременно живёт одна цепочка. Следующая ждёт в очереди и стартует
# сразу, как закончится текущая, — это ещё один способ не зависеть от
# расписания: очередь сама передаёт эстафету.
concurrency:
  group: rigs-bot
  cancel-in-progress: false

# Отрезки идут строго друг за другом. if: always() — чтобы падение
# одного отрезка не обрывало всю цепочку.
jobs:
  leg1:
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          # именно main, а не коммит-триггер: предыдущий отрезок уже
          # дописал в posted.json свои посты, и их надо увидеть
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Configure git
        run: |
          git config user.name "rigs-bot"
          git config user.email "bot@users.noreply.github.com"
      - name: Publish rigs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CATCH_UP: ${{ inputs.catch_up }}
          REDO: ${{ inputs.redo }}
          GIT_AUTOSAVE: "1"
        run: python bot.py
      - name: Save bot memory
        if: always()
        run: |
          git add posted.json
          git diff --staged --quiet || git commit -m "update posted rigs"
          git pull --rebase --autostash || true
          git push || true

  leg2:
    runs-on: ubuntu-latest
    needs: leg1
    if: always()
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
