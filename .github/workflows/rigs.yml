name: Animation Rigs Bot

on:
  schedule:
    # Это НЕ расписание постов. Постами управляет сам бот: раз в два часа
    # и только днём (POST_EVERY_MINUTES и ACTIVE_HOURS в config.py).
    # Один запуск живёт около шести часов и всё это время отмеряет паузы
    # сам. Расписание нужно только чтобы изредка начать новый запуск,
    # если цепочка оборвалась — поэтому раз в час, а не чаще.
    # Минута 7, а не 0: на круглых минутах у GitHub самая длинная очередь.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      catch_up:
        description: "Режим догона: пометить всё найденное виденным, ничего не публиковать"
        type: boolean
        default: false
      redo:
        description: "Переопубликовать риги по именам через запятую (например: Brooke, Spider-Gwen)"
        type: string
        default: ""

permissions:
  contents: write

# Одновременно живёт только одно задание. Новое встаёт в очередь и
# стартует сразу, как закончится текущее, — так цепочка длинных запусков
# продолжается сама и без расписания.
concurrency:
  group: rigs-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # Запуск длинный: внутри него бот сам держит паузу между постами.
    # Потолок задания в Actions — шесть часов, берём чуть меньше.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "rigs-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Publish rigs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CATCH_UP: ${{ inputs.catch_up }}
          REDO: ${{ inputs.redo }}
          # бот сам коммитит память после каждого поста, чтобы она
          # не потерялась, если запуск оборвётся посреди часа
          GIT_AUTOSAVE: "1"
        run: python bot.py

      - name: Save bot memory
        if: always()
        run: |
          git add posted.json
          git diff --staged --quiet || git commit -m "update posted rigs"
          git pull --rebase --autostash || true
          git push || true
