name: Animation Rigs Bot

on:
  schedule:
    # Раз в 30 минут — интервал, который GitHub отдаёт стабильно.
    # Сам шаг между постами (20 минут) бот держит внутри запуска и
    # отсчитывает от времени последнего поста, сохранённого в posted.json.
    # Поэтому пропуск срабатывания не ломает ритм: следующий запуск
    # видит, что пора публиковать, и делает это сразу.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      catch_up:
        description: "Режим догона: пометить всё найденное виденным, ничего не публиковать"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rigs-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # Запуск живёт ~28 минут, потолок с запасом.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "rigs-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Publish rigs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CATCH_UP: ${{ inputs.catch_up }}
          # бот сам коммитит память после каждого поста, чтобы она
          # не потерялась, если запуск оборвётся посреди часа
          GIT_AUTOSAVE: "1"
        run: python bot.py

      - name: Save bot memory
        if: always()
        run: |
          git add posted.json
          git diff --staged --quiet || git commit -m "update posted rigs"
          git pull --rebase --autostash || true
          git push || true
