name: Animation Rigs Bot

on:
  schedule:
    # РАЗ В ЧАС. Не пытаемся просить у GitHub запуск каждые 10 минут:
    # короткие расписания он массово пропускает. Часовое отдаёт стабильно,
    # а десятиминутный шаг бот отсчитывает сам внутри запуска
    # (POST_EVERY_MINUTES и LOOP_MINUTES в config.py).
    # Минута 7, а не 0: на круглых минутах у GitHub самая большая очередь.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      catch_up:
        description: "Режим догона: пометить всё найденное виденным, ничего не публиковать"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rigs-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    # Запуск живёт около часа, поэтому потолок с запасом.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name "rigs-bot"
          git config user.email "bot@users.noreply.github.com"

      - name: Publish rigs
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CATCH_UP: ${{ inputs.catch_up }}
          # бот сам коммитит память после каждого поста, чтобы она
          # не потерялась, если запуск оборвётся посреди часа
          GIT_AUTOSAVE: "1"
        run: python bot.py

      - name: Save bot memory
        if: always()
        run: |
          git add posted.json
          git diff --staged --quiet || git commit -m "update posted rigs"
          git pull --rebase --autostash || true
          git push || true
