# Курируемый список ригов — основа канала.
# Всё проверено по первоисточникам: ссылки, цены, лицензии.
#
# free:     true/false
# license:  как написано у автора. Файл прикладывается к посту ТОЛЬКО если
#           лицензия распознана как CC-0 / CC-BY / MIT и размер < 48 МБ.
# file_url: прямая ссылка на файл. Оставляй пустой, если раздача запрещена.
# ru:       описание для канала (бот не будет переводить, если оно уже здесь)

